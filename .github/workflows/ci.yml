name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Verify the published packages across their supported Node range
        # (engines: ">=18"). Example apps need Node 20.19+ (Vite 8), so their
        # build is skipped on 18 below.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        # Examples import the bindings' built types, so this relies on the
        # Build step above having produced each package's dist.
        run: pnpm typecheck:examples

      - name: Test
        run: pnpm test

      - name: Build examples
        if: matrix.node != '18'
        run: pnpm --filter "example-*" -r build
