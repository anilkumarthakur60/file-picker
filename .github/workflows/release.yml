name: Release

on:
  push:
    branches: [main]
  # Re-run a release without inventing a commit  needed whenever a run failed
  # for a reason outside the repo (a missing NPM_TOKEN, an unconfigured scope).
  workflow_dispatch:

# Only one release run at a time.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push version-bump commits / git tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # When changesets exist -> opens/updates a "Version Packages" PR.
      # When that PR is merged (no changesets left) -> builds and publishes to npm.
      #
      # pnpm publishes via npm trusted publishing when the package trusts this
      # workflow: it swaps the job's OIDC token (`id-token: write` above) for a
      # short-lived npm token and attaches provenance. Packages that don't trust
      # it yet fall back to NPM_TOKEN ("Skipped OIDC" in the log). Set up with
      #   npm trust github <package> --repo anilkumarthakur60/file-picker \
      #     --file release.yml --allow-publish
      # then NPM_TOKEN can be removed.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
