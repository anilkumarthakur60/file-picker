version: 2
updates:
  # ── GitHub Actions used in the workflows (actions/checkout, setup-node, …) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # changesets/action v2 only works with @changesets/cli v3. Bump them
      # together by hand rather than letting this group break the release.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns:
          - '*'

  # ── npm / pnpm dependencies (single root pnpm-lock.yaml covers the workspace) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Batch the dev tooling (eslint, prettier, tsup, vitest, typescript, …)
      # into a single PR to keep the queue quiet. Only minor/patch updates are
      # grouped so the batch can auto-merge; majors get their own PR to review.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
